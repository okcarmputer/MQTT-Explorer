version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24
    volumes:
      - ..:/workspaces/MQTT-Explorer:cached
    command: sleep infinity
    network_mode: service:mosquitto
    environment:
      - MQTT_EXPLORER_USERNAME=dev
      - MQTT_EXPLORER_PASSWORD=dev123

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
      - '3000:3000'
      - '8080:8080'
      - '5900:5900'
      - '6080:6080'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Without a mount here, persistence_location's mosquitto.db would only
      # live in the container's writable layer and still be lost whenever
      # the devcontainer is rebuilt (not just on a plain restart) — this
      # named volume is what actually makes `persistence true` durable.
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
