# Mosquitto configuration for development
listener 1883
allow_anonymous true

# Persists retained messages, subscriptions, and queued messages for
# offline/durable clients to disk, so a broker restart doesn't lose them.
# This is NOT a time-series history of every published value — Mosquitto
# only ever keeps the latest retained message per topic. Value history is
# handled separately, in the app itself (see backend/src/Model/MessageHistoryStore.ts).
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 300
